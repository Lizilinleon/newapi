# ============================================================================
# New-API 依赖服务: Redis + PostgreSQL
# ----------------------------------------------------------------------------
# 用途: 为运行在宿主机或其他服务器上的 new-api 提供 Redis 缓存与 PostgreSQL 数据库。
#       两个服务都把端口暴露到宿主机, 数据持久化到宿主机目录, 均需密码访问。
#
# 端口(宿主机):
#   - PostgreSQL : 5432
#   - Redis      : 6379
#
# 账号密码已写死在本文件中, 可直接 docker compose up -d 启动。
# ============================================================================

services:
  docs:
    build:
      context: ./docs-site
    image: armnet-docs:local
    container_name: armnet-docs
    restart: unless-stopped
    ports:
      - "5171:80"
    networks:
      - new-api-unit

  postgres:
    image: postgres:16
    container_name: newapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: armnet_token
      # Docker Compose 中 $ 需要写成 $$, 容器内实际密码是 TpfV$TWJz$mw
      POSTGRES_PASSWORD: "TpfV$$TWJz$$mw"
      POSTGRES_DB: armnet_token
      # 数据实际存放在子目录 pgdata, 避免挂载根目录权限问题
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # 宿主机:容器 -- 暴露给宿主机或同网段服务访问
      - "5432:5432"
    volumes:
      # 数据保存到宿主机 /data/armnet/db, 注意目录名是 db
      - /data/armnet/db:/var/lib/postgresql/data
    networks:
      - new-api-unit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U armnet_token -d armnet_token"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: newapi-redis
    restart: unless-stopped
    # 用 requirepass 开启密码认证, appendonly 开启持久化
    # Docker Compose 中 $ 需要写成 $$, Redis 实际密码是 TpfV$TWJz$mw
    command: ["redis-server", "--requirepass", "TpfV$$TWJz$$mw", "--appendonly", "yes"]
    ports:
      # 宿主机:容器 -- 暴露给宿主机或同网段服务访问
      - "6379:6379"
    volumes:
      # 数据保存到宿主机 /data/armnet/redis
      - /data/armnet/redis:/data
    networks:
      - new-api-unit
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a 'TpfV$$TWJz$$mw' ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  new-api-unit:
    name: new-api-unit
    driver: bridge

# ============================================================================
# new-api 连接配置注释
# ----------------------------------------------------------------------------
# 如果 new-api 跑在宿主机:
#   SQL_DSN=postgres://armnet_token:TpfV$TWJz$mw@127.0.0.1:5432/armnet_token?sslmode=disable
#   REDIS_CONN_STRING=redis://default:TpfV$TWJz$mw@127.0.0.1:6379/0
#
# 如果 new-api 也跑在同一个 Docker 网络 new-api-unit:
#   SQL_DSN=postgres://armnet_token:TpfV$TWJz$mw@postgres:5432/armnet_token?sslmode=disable
#   REDIS_CONN_STRING=redis://default:TpfV$TWJz$mw@redis:6379/0
# ============================================================================
